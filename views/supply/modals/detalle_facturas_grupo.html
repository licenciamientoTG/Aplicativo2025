{# Modal: Detalle de facturas de un grupo de contabilidad #}
<div class="modal-body">

    <div class="d-flex align-items-center gap-3 mb-3">
        <div class="border rounded p-2 text-center bg-light" style="min-width:130px;">
            <div class="text-muted" style="font-size:0.7rem; text-transform:uppercase; letter-spacing:.5px;">ID Contabilidad</div>
            <div class="fw-bold text-primary" id="dfg_accounting_id" style="font-size:1rem;">-</div>
        </div>
        <div class="border rounded p-2 text-center bg-light" style="min-width:130px;">
            <div class="text-muted" style="font-size:0.7rem; text-transform:uppercase; letter-spacing:.5px;">Empresa</div>
            <div class="fw-bold text-dark" id="dfg_empresa" style="font-size:0.85rem;">-</div>
        </div>
        <div class="border rounded p-2 text-center bg-light" style="min-width:100px;">
            <div class="text-muted" style="font-size:0.7rem; text-transform:uppercase; letter-spacing:.5px;">Facturas</div>
            <div class="fw-bold text-primary" id="dfg_total_facturas" style="font-size:1rem;">0</div>
        </div>
        <div class="border rounded p-2 text-center bg-light" style="min-width:130px;">
            <div class="text-muted" style="font-size:0.7rem; text-transform:uppercase; letter-spacing:.5px;">Monto Total</div>
            <div class="fw-bold text-success" id="dfg_monto_total" style="font-size:1rem;">$0.00</div>
        </div>
    </div>

    <!-- Estado de carga -->
    <div id="dfg_loading" class="text-center py-4">
        <i class="fas fa-spinner fa-spin fa-2x text-secondary"></i>
        <p class="mt-2 text-muted">Cargando facturas...</p>
    </div>

    <!-- Tabla -->
    <div id="dfg_tabla_container" style="display:none;">
        <div class="table-responsive" style="max-height:420px; overflow-y:auto;">
            <table class="table table-sm table-bordered table-hover mb-0" id="dfg_tabla">
                <thead class="table-dark" style="position:sticky; top:0; z-index:1;">
                    <tr>
                        <th>Req. #</th>
                        <th>Empresa</th>
                        <th>Proveedor</th>
                        <th>Folio</th>
                        <th>Factura</th>
                        <th>Estación</th>
                        <th>Vencimiento</th>
                        <th class="text-end">Monto</th>
                        <th class="text-center" title="Factura descargada del correo de Alberto">XML/PDF</th>
                    </tr>
                </thead>
                <tbody id="dfg_tbody"></tbody>
            </table>
        </div>
    </div>

    <div id="dfg_empty" style="display:none;" class="text-center text-muted py-4">
        <i class="fas fa-inbox fa-2x d-block mb-2 text-secondary"></i>
        No se encontraron facturas para este grupo.
    </div>

</div>

<div class="modal-footer">
    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">
        <i class="fas fa-times"></i> Cerrar
    </button>
</div>
