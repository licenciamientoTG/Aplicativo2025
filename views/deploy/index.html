<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Deploy · TotalGas</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f2f5f4;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#1c2b26}
  .card{width:min(92vw,420px);background:#fff;border-radius:16px;padding:28px 24px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
  h1{margin:0 0 4px;font-size:1.4rem;color:#009559}
  p.sub{margin:0 0 20px;color:#667;font-size:.9rem}
  input[type=password],input[type=text]{width:100%;padding:14px;font-size:1.3rem;letter-spacing:.3em;text-align:center;border:2px solid #cfd8d4;border-radius:10px}
  input:focus{outline:none;border-color:#009559}
  button,a.btn{display:block;width:100%;margin-top:14px;padding:14px;background:#009559;color:#fff;border:0;border-radius:10px;font-size:1rem;font-weight:600;text-align:center;text-decoration:none;cursor:pointer}
  .err{margin-top:12px;color:#b3261e;font-size:.9rem;text-align:center}
  .item{border:1px solid #e0e6e3;border-radius:12px;padding:14px;margin-top:12px}
  .item b{word-break:break-all;font-size:.95rem}
  .item small{display:block;color:#667;margin-top:2px}
  .out{display:block;margin-top:18px;text-align:center;color:#667;font-size:.85rem}
</style>
</head>
<body>
<div class="card">
  <h1>Deploy</h1>
  {% if not unlocked %}
    <p class="sub">Ingresa el código de acceso</p>
    <form method="post" autocomplete="off">
      <input type="password" name="code" inputmode="numeric" autofocus required>
      <button type="submit">Entrar</button>
      {% if error %}<div class="err">{{ error }}</div>{% endif %}
    </form>
  {% else %}
    <p class="sub">Aplicaciones disponibles</p>
    {% for f in files %}
      <div class="item">
        <b>{{ f.name }}</b>
        <small>{{ f.size }} MB · {{ f.date }}</small>
        <a class="btn" href="{{ url('deploy.download', {file: f.name}) }}">Descargar APK</a>
      </div>
    {% else %}
      <p class="sub">No hay APKs publicadas todavía.</p>
    {% endfor %}
    <a class="out" href="{{ url('deploy.logout') }}">Salir</a>
  {% endif %}
</div>
</body>
</html>
