<style>
  /* Mismo look de tablas que Contabilidad > Notas de Crédito vs Consumos. */

  div.dt-button-collection { z-index: 9999 !important; }

  .cv-monto { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .cv-neg { color: #dc3545; font-weight: 600; }
  .cv-mono { font-family: monospace; white-space: nowrap; font-size: .75rem; }

  .cv-tabla-wrap { border: 2px solid #cbd5e1; border-radius: .5rem; background: #fff; overflow: hidden; }
  .cv-tabla-wrap .cv-top {
    display: flex; justify-content: space-between; align-items: center;
    padding: .5rem .75rem; background: #fff; border-bottom: 2px solid #cbd5e1;
  }

  .cv-warn  { background: #fef3c7; color: #92400e; }
  .cv-bad   { background: #fee2e2; color: #991b1b; }

  .cv-resumen .cv-chip {
    border: 1px solid #e2e8f0; border-radius: .5rem; padding: .4rem .75rem; background: #fff;

  /* Resumen (cascada) */

  #cvProgPanel .cv-prog-hint { font-size: .72rem; color: #64748b; margin-bottom: .4rem; }
