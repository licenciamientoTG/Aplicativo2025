<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<meta name="description" content="TotalGas, un sistema de gestión combustible.">
	<meta name="author" content="AdminKit">
	<meta name="keywords" content="adminkit, bootstrap, bootstrap 5, admin, dashboard, template, responsive, css, sass, html, theme, front-end, ui kit, web">

	<link rel="preconnect" href="https://fonts.gstatic.com">
	<link rel="shortcut icon" href="img/icons/icon-48x48.png" />

	<title>TotalGas Login</title>

	<link href="{{ CSS }}app.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
	<main class="d-flex w-100">
		<div class="container d-flex flex-column">
			<div class="row vh-100">
				<div class="col-sm-10 col-md-8 col-lg-6 col-xl-5 mx-auto d-table h-100">
					<div class="d-table-cell align-middle">
                        <div class="text-center">
                          <img src="{{ IMAGES }}logos\logo_TotalGas_hor.png" class="rounded img-fluid" alt="...">
                        </div>
						<div class="text-center mt-4">
							<h1 class="h2">¡Bienvenid@!</h1>
							<p class="lead">
								Ingresa tus credenciales para poder continuar
							</p>
						</div>

						<div class="card">
							<div class="card-body">
								<div class="m-sm-3">
								<form action="{{APP_NAME}}_assets/includes/validate.inc.php" method="post">
										<div class="mb-3">
											<label class="form-label">Usuario</label>
											<input class="form-control form-control-lg" type="text" name="username" placeholder="Ingresa tu usuario" />
										</div>
										<div class="mb-3">
											<label class="form-label">Contraseña</label>
											<div class="input-group">
													<input class="form-control form-control-lg" type="password" name="password" id="password" placeholder="Ingresa tu contraseña">
													<button type="button" class="btn btn-outline-secondary" id="togglePassword" aria-label="Mostrar contraseña" title="Mostrar contraseña">
														<svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
													</button>
												</div>
										</div>
										<div class="mb-3">
										<input text class="form-control form-control-lg" hidden   name="ip" id="ip" >
										<input text class="form-control form-control-lg"  hidden  name="route" id="route" >

                                            <button type="submit" class="btn btn-primary w-100">Ingresar</button>
										</div>
									</form>
								</div>
							</div>
						</div>
						<div class="text-center mb-3">
							¿No tienes una cuenta?
                            <p><a href="javascript:void(0)">Solicítala al departamento de Sistemas</a></p>
						</div>
					</div>
				</div>
			</div>
		</div>
	</main>

	<script src="{{ js_v('app.js') }}"></script>
</body>
<script>
document.addEventListener('DOMContentLoaded', function () {
    var pwd = document.getElementById('password');
    var toggle = document.getElementById('togglePassword');
    var eye = document.getElementById('eyeIcon');
    var eyeOpen = eye.innerHTML;
    var eyeOff = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
    toggle.addEventListener('click', function () {
        var mostrar = pwd.type === 'password';
        pwd.type = mostrar ? 'text' : 'password';
        eye.innerHTML = mostrar ? eyeOff : eyeOpen;
        toggle.setAttribute('aria-label', mostrar ? 'Ocultar contraseña' : 'Mostrar contraseña');
        toggle.title = toggle.getAttribute('aria-label');
    });

    // Captura el path completo (ej: /income/invoices) y los parámetros (ej: ?id=1)
    var path = window.location.pathname;
    var search = window.location.search;
    var fullRoute = path + search;

    // Validación para evitar que redirija al login o a la raíz vacía
    // Si la ruta es solo "/", "/index.php" o vacía, definimos el home por defecto
    if (fullRoute === '/' || fullRoute === '/index.php' || fullRoute.trim() === '') {
        fullRoute = '/home/index';
    }

    console.log("Ruta de redirección capturada:", fullRoute);
    document.getElementById('route').value = fullRoute;
});

function obtenerIP(response) {
    console.log(response);
    var user_ip = response.ip;
	document.getElementById('ip').value = user_ip;
}
</script>
</html>
