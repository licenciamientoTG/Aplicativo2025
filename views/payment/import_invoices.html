{% extends "views/layouts/base.html" %}
{% block title %}Importar Facturas{% endblock %}
{% block mycss %}
<style>
    .drop-zone {
        border: 2px dashed #adb5bd;
        border-radius: 8px;
        padding: 40px;
        text-align: center;
        cursor: pointer;
        transition: background 0.2s, border-color 0.2s;
        background: #f8f9fa;
    }
    .drop-zone.dragover {
        background: #e8f4fd;
        border-color: #0d6efd;
    }
    .drop-zone i { font-size: 2.5rem; color: #adb5bd; }
    .drop-zone.dragover i { color: #0d6efd; }
    #file-name { margin-top: 10px; font-size: 0.9rem; color: #6c757d; }
</style>
{% endblock %}
{% block content %}
<div class="container-fluid p-4">
    <div class="row">
        <div class="col-12 col-md-6 col-lg-5 mx-auto">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    <i class="fas fa-file-invoice"></i> Importar Factura PDF
                </div>
                <div class="card-body">
                    <form id="import-form">
                        <div class="mb-3">
                            <label class="form-label">Proveedor</label>
                            <select class="form-select" id="proveedor" name="proveedor" required>
                                <option value="">Selecciona un proveedor...</option>
                                <option value="aemsa">AEMSA</option>
                                <option value="enerey">ENEREY</option>
                                <option value="essafuel">ESSAFUEL</option>
                                <option value="lobo">LOBO</option>
                                <option value="mcg">MCG</option>
                                <option value="petrotal">PETROTAL</option>
                                <option value="premiergas">PREMIERGAS</option>
                                <option value="tesoro">TESORO</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Archivo PDF</label>
                            <div class="drop-zone" id="drop-zone">
                                <i class="fas fa-cloud-upload-alt"></i>
                                <p class="mb-0 mt-2">Arrastra el PDF aquí o haz clic para seleccionar</p>
                                <div id="file-name">Ningún archivo seleccionado</div>
                            </div>
                            <input type="file" id="pdf-input" accept="application/pdf" class="d-none">
                        </div>
                        <button type="submit" class="btn btn-primary w-100" id="btn-import">
                            <i class="fas fa-upload"></i> Importar Factura
                        </button>
                    </form>

                    <div id="result-box" class="mt-3 d-none"></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block myjs %}
<script>
    const dropZone  = document.getElementById('drop-zone');
    const pdfInput  = document.getElementById('pdf-input');
    const fileLabel = document.getElementById('file-name');
    let selectedFile = null;

    dropZone.addEventListener('click', () => pdfInput.click());

    dropZone.addEventListener('dragover', e => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        const file = e.dataTransfer.files[0];
        if (file && file.type === 'application/pdf') setFile(file);
    });

    pdfInput.addEventListener('change', () => {
        if (pdfInput.files[0]) setFile(pdfInput.files[0]);
    });

    function setFile(file) {
        selectedFile = file;
        fileLabel.textContent = file.name;
        dropZone.style.borderColor = '#198754';
    }

    document.getElementById('import-form').addEventListener('submit', function (e) {
        e.preventDefault();

        const proveedor = document.getElementById('proveedor').value;
        if (!proveedor) return showResult('warning', 'Selecciona un proveedor.');
        if (!selectedFile) return showResult('warning', 'Selecciona un archivo PDF.');

        const btn = document.getElementById('btn-import');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Importando...';

        const formData = new FormData();
        formData.append('pdf', selectedFile);
        formData.append('proveedor', proveedor);

        $.ajax({
            url: '/payment/import_invoice_pdf',
            type: 'POST',
            data: formData,
            processData: false,
            contentType: false,
            success: function (res) {
                if (res.success) {
                    let html = `<strong>ID:</strong> ${res.factura_id}<br>
                                <strong>UUID:</strong> ${res.uuid}<br>
                                <strong>Ruta:</strong> ${res.ruta || '—'}<br>
                                <small>${res.mensaje}</small>`;
                    if (res.advertencia) html += `<br><small class="text-warning"><i class="fas fa-exclamation-triangle"></i> ${res.advertencia}</small>`;
                    showResult('success', html);
                } else {
                    const estadoLabel = {
                        duplicada: 'Factura duplicada',
                        cancelada: 'Factura cancelada',
                        nota_credito: 'Nota de crédito (no se importa)',
                        complemento_pago: 'Complemento de pago (no se importa)',
                    };
                    const titulo = estadoLabel[res.estado] || 'No importada';
                    showResult('warning', `<strong>${titulo}:</strong> ${res.message}`);
                }
            },
            error: function () {
                showResult('danger', 'Error de comunicación con el servidor.');
            },
            complete: function () {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-upload"></i> Importar Factura';
            }
        });
    });

    function showResult(type, html) {
        const box = document.getElementById('result-box');
        box.className = `alert alert-${type}`;
        box.innerHTML = html;
        box.classList.remove('d-none');
    }
</script>
{% endblock %}
